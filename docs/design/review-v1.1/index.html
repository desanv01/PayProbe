<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PayProbe UI review v1.1 — synthetic</title><style>body{margin:0;background:#17191E;color:#F4F0E8;font:16px Consolas,monospace}header,nav,main{padding:16px 24px}header{border-bottom:1px solid #E9B44C}h1{font-size:20px;color:#E9B44C}p{max-width:85ch;line-height:1.5}a{color:#E9B44C}label{display:inline-block;margin:8px 16px 8px 0}select,button{background:#17191E;color:#F4F0E8;border:1px solid #E9B44C;padding:8px;font:inherit}button:focus,select:focus,a:focus{outline:3px solid #E9B44C}img{display:block;max-width:100%;height:auto;border:1px solid #4B3B68}small{color:#E9B44C}</style><header><h1>PAYPROBE / UI REVIEW v1.1</h1><small>SYNTHETIC DESIGN PREVIEW / SIMULATED PAYMENTS</small><p>Review artifacts only. Controls switch mock screens. No payment, PayPal, backend or AI calls. Explicit user approval remains pending.</p><a href="browser.html">Small browser access / report proposal →</a></header><nav><label>State <select id="state"><option>doctor</option><option>missing-key</option><option>plan</option><option>approval</option><option>running</option><option>uncertain</option><option>reconcile</option><option>ledger</option><option>evidence</option><option>inconclusive</option><option>unsupported</option><option>error</option><option>empty</option><option>filter</option></select></label><label>Terminal <select id="size"><option value="120x36">120 × 36</option><option value="80x24">80 × 24</option></select></label><button id="next">Next state</button></nav><main><img id="screen" alt="Synthetic terminal mockup"><p id="caption"></p></main><script>const state=document.querySelector('#state'),size=document.querySelector('#size');function show(){document.querySelector('#screen').src=state.value+'-'+size.value+'.svg';document.querySelector('#caption').textContent='Reviewing '+state.value+' / '+size.value+' — synthetic design data, simulated payment provider';}document.querySelector('#next').onclick=()=>{state.selectedIndex=(state.selectedIndex+1)%state.options.length;show()};state.onchange=size.onchange=show;show();</script></html>
